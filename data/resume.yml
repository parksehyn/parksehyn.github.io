projects:
  - slug: mochi
    title: 모찌
    icon: assets/mochi-icon.png
    period: 2026.06 – 2026.08
    meta: [팀 3인, 백엔드, 2026 AI·SW중심대학 디지털 경진대회 최우수상]
    summary: 스크린샷·링크·기록을 맡아두고 필요할 때 먼저 떠올려주는 기억 에이전트 앱. 20·30대 53명 설문에서 92.5%가 저장한 캡처를 다시 보지 않는다는 문제에서 출발했습니다.
