    highlights:
      - 관측성으로 분석 워커의 병목을 찾아 분리해 분석 완료 시간 **80.6초 → 20.5초 (약 75% 단축)**
      - 벡터 검색에 BM25와 리랭커를 결합해 Top-3 적중률 **59% → 87%**, 골든셋 자동 평가로 정답률 **91.3% → 95.6%**
    links:
      - label: GitHub
        href: https://github.com/dku-mochi/mochi
      - label: 소개·시연
        href: https://wistful-money-4a2.notion.site/MOCHI-3a12399d842480eba697fda9f7e66e50
    images:
      - src: assets/mochi-overview.jpg
        caption: 저장한 기록을 카테고리로 정리하고, 마감처럼 놓치기 쉬운 순간을 먼저 알려줍니다.
      - src: assets/mochi-analysis-agent.jpg
        caption: Analysis Agent 처리 흐름. 실행·도구 로그(agent_runs·tool_calls)를 별도 저장소에 기록합니다.
    details:
      - title: 관측성 구축과 분석 워커 병목 개선
        problem: 처리 단계별 상태를 볼 수 없어 지연 원인을 파악하기 어려웠습니다.
        solution:
          - OpenTelemetry로 처리 단계와 외부 호출을 계측하고, 큐 대기 시간·첫 응답 시간·워커 포화도 등 15개 지표와 트레이스를 Grafana로 구성, 알림 규칙 8개 설정
          - 지표로 분석 워커가 후속 LLM 호출(리콜 알림 설계)을 기다리는 동안 슬롯을 붙잡고 있는 것을 확인하고, 해당 단계를 동시성이 제한된 별도 풀로 분리
        result: 15초 지연 주입·동시 캡처 10건 조건에서 전체 분석 완료 시간 **80.6초 → 20.5초 (약 75% 단축)**
      - title: 검색 품질 개선과 평가 체계
        problem: 초기 벡터 검색은 여러 정답을 찾아야 하는 질의에서 일부를 놓치고, 단일 정답 질의에서도 관련 없는 항목이 상위에 올라왔습니다.
        solution:
          - 검색 결과의 관련성을 LLM as a Judge로 평가하고 다른 LLM으로 교차 검증한 뒤, 정답이 정해진 30개 질의로 임베딩 모델·차원·문서 구성 45개 조합을 nDCG로 비교
          - 의미가 비슷한 표현에 강한 벡터 검색과 정확한 키워드에 강한 BM25를 결합하고 리랭커 적용
          - 프롬프트를 고칠 때마다 기존 사례가 틀리는 회귀가 반복되어, 실제 운영 프롬프트와 스키마를 코드가 불러와 자동 평가하는 골든셋 하네스 구축 (46개 → 229개, 잘못된 라벨 3건 수정)
        result: Top-3 적중률 **59% → 87%**, 단일 정답 Top-1 정확도 **3.6배**, 골든셋 정답률 **91.3% → 95.6%**
      - title: 에이전트 실행 추적
        problem: ""
        solution:
