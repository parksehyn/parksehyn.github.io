projects:
  - slug: mochi
    title: 모찌
    icon: assets/mochi-icon.png
    period: 2026.06 – 2026.08
    meta: [팀 3인, 백엔드, 2026 AI·SW중심대학 디지털 경진대회 최우수상]
    summary: 스크린샷 · 링크 · 기록을 맡아두고 필요할 때 먼저 떠올려주는 기억 에이전트 앱.
    tech: [FastAPI, OpenTelemetry, Grafana, iOS]
    highlights:
      - OpenTelemetry · Grafana 관측성 구축 후 분석 워커 병목을 분리해 분석 완료 시간 **80.6초 → 20.5초 (약 75% 단축)**
      - 에이전트 실행마다 agent_runs, 도구 호출마다 tool_calls를 남기는 실행 추적 구현
    links:
      - label: GitHub
        href: https://github.com/dku-mochi/mochi
      - label: 소개 · 시연
        href: https://wistful-money-4a2.notion.site/MOCHI-3a12399d842480eba697fda9f7e66e50
    images:
      - src: assets/mochi-overview.jpg
        caption: 저장한 기록을 카테고리로 정리하고, 마감처럼 놓치기 쉬운 순간을 먼저 알려줍니다.
      - src: assets/mochi-analysis-agent.jpg
        caption: Analysis Agent 처리 흐름. 실행·도구 로그(agent_runs · tool_calls)를 별도 저장소에 기록합니다.
    details:
      - title: 관측성 구축과 분석 워커 병목 개선
        problem: 처리 단계별 상태를 볼 수 없어 지연 원인을 파악하기 어려웠습니다.
        solution:
          - OpenTelemetry로 처리 단계와 외부 호출을 계측하고, 큐 대기 시간 · 첫 응답 시간 · 워커 포화도 등 15개 지표와 트레이스를 Grafana로 구성, 알림 규칙 8개 설정
          - 지표로 분석 워커가 후속 LLM 호출(리콜 알림 설계)을 기다리는 동안 슬롯을 붙잡고 있는 것을 확인하고, 해당 단계를 동시성이 제한된 별도 풀로 분리
        result: 15초 지연 주입 · 동시 캡처 10건 조건에서 전체 분석 완료 시간 **80.6초 → 20.5초 (약 75% 단축)**
      - title: 에이전트 실행 추적
