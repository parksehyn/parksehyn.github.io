        solution:
          - PDF는 PDFBox로 텍스트를 추출하고, 텍스트가 거의 없으면 스캔본으로 판단해 페이지를 150 DPI 이미지로 렌더링한 뒤 GPT-4o Vision으로 읽도록 분기
          - 엑셀은 Apache POI로 시트 텍스트를 추출하고, DOCX 양식은 세로 병합 셀의 레이블을 이어받도록 처리
          - 추출한 텍스트를 500자 단위 · 100자 겹침으로 청킹하고 text-embedding-3-small로 임베딩해 PostgreSQL pgvector에 저장
