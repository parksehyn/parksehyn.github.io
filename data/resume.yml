    period: 2026.09 – 재직 중
    role: 기술개발팀 · 연구원 (R&D 인턴)
    projects:
      # slug와 details가 있으면 /work/<slug>/ 상세 페이지가 만들어집니다.
      - slug: jntp-content
        tags: [오픈플랫폼, 전남TP]
        title: 카카오 지역주도형 AI대전환
        period: 2026.09 – 2026.10
        role: 통합 · 데이터포털 운영시스템 — 콘텐츠 마당 백엔드 담당
        summary: 통합포털 · 데이터포털 · 운영시스템 3개 서버에 걸친 콘텐츠 마당(공지사항 · 자료실 · FAQ · 팝업 배너 · 1:1 문의 · 활용 사례) 백엔드를 설계 · 구현했습니다.
        meta: [PR 34건 병합, 설계 결정 기록 66건]
        tech: [Python, FastAPI, SQLAlchemy, Alembic, PostgreSQL, Kubernetes, pytest, GitHub Actions]
        highlights:
          - 3개 서버에 걸친 콘텐츠 마당 6개 게시판 백엔드 설계 · 구현, 운영시스템이 두 포털을 저장 없이 관리하도록 중계 API 구현
          - 이미지를 고정 URL + 재사용 서명 URL + WebP 반응형 파생으로 바꾸고 변환을 백그라운드로 분리해 저장 시간 **최대 53초 → 약 5초**
          - 코드 리뷰 지적을 원칙 12개와 PR 체크리스트로 정리해 적용, 이후 **PR 10건 수정 요청 없이 승인**
        details:
          - title: 콘텐츠 이미지 최적화
            problem: 응답마다 1시간짜리 서명 URL을 새로 만들어 새로고침할 때마다 원본 이미지를 다시 받았고, 리사이징 · WebP가 없었습니다. 비공개로 바꾼 글의 이미지는 새 접근을 막아야 했습니다.
            solution:
              - 버킷 정책 · 결정적 서명 URL · 서버 스트리밍 · 고정 경로 + 302 네 가지 안을 비교해, 고정 경로에서 공개 여부를 확인한 뒤 10분 단위로 재사용하는 서명 URL로 302 하는 방식 채택
              - 640 · 1280 · 2560 WebP 파생과 서버가 채운 srcset · sizes · width · height로 프론트엔드 수정 없이 반응형 이미지 적용, 레이아웃 밀림(CLS) 0
              - 운영 파드와 같은 조건(CPU 1 · 메모리 1Gi)에서 동기 변환과 백그라운드 변환을 측정해 백그라운드 작업자로 설계, FOR UPDATE SKIP LOCKED 선점 · lease · 재시도로 중복 처리 방지
              - 용량은 작지만 픽셀이 큰 이미지가 변환 중 메모리를 수백 MB 쓰는 것을 실측으로 찾아 픽셀 상한 도입 (1Gi 파드에서 33장 연속 처리 피크 500MiB)
            result: 브라우저 캐시가 동작하고 비공개 전환 시 고정 경로는 즉시 404. 관리자 저장 시간은 동기 변환 대비 **최대 53초 → 약 5초**
          - title: 운영시스템 ↔ 두 포털 중계(BFF)
            problem: 운영시스템이 통합포털 · 데이터포털의 6개 게시판을 관리해야 했지만, 두 포털은 검색 파라미터, 값 생략 시 동작, 응답 필드가 서로 달랐습니다.
            solution:
              - 운영시스템은 데이터를 저장하지 않고 두 포털의 관리자 API로 중계 (6개 게시판 × 2개 포털의 목록 · 상세 · 등록 · 수정 · 삭제 · 업로드)
              - 포털별 경로 · DTO는 나누고 처리 코드는 라우터 factory로 공유해, OpenAPI에 포털별 허용값이 정확히 드러나도록 구성
              - 검색 파라미터 이름, 수정 시 공개 여부 생략 동작, 첨부 생략 시 전체 삭제 같은 계약 차이를 운영시스템 DTO에서 흡수
              - 구간별 타임아웃 예산을 "원천 처리 시간보다 길고 Gateway 제한보다 짧게" 재설계 (Gateway 90초 → 중계 75초 → 원천 확인 60초)
            result: 실제 서버를 띄운 E2E(FAQ 98건 · 활용 사례 82건)로 검증. 스토리지를 20초 멈춘 장애 주입에서 기존 15초 설정은 "응답 실패 · 저장 성공 → 재시도 409"를 재현했고, 새 설정은 **1건만 정상 등록**
          - title: 동시성 · 트랜잭션
            problem: 행 잠금을 쥔 채 스토리지 응답을 기다리거나, 동시에 들어온 수정 · 삭제가 서로의 결과를 덮어쓰는 문제가 있었습니다.
            solution:
              - 첨부 검증의 스토리지 호출을 DB 트랜잭션 밖으로 빼고, 잠금 안에서는 DB 상태만 재검증하도록 변경 (5개 게시판 공통 적용)
              - 동시 수정 시 복수 선택값이 합쳐지는 lost update, 수정 · 삭제 경합으로 삭제된 글이 되살아나는 문제를 첫 조회 행 잠금으로 해결
              - 외부 회원 정보 조회 동안 DB 세션을 점유하지 않도록 조회 단계를 분리
            result: 스토리지 지연이 DB 커넥션 · 행 잠금 점유로 번지지 않게 개선
          - title: 보안 · 개인정보 · 데이터 이관
            problem: ""
            solution:
              - 사용자 입력 HTML에 허용 목록 정화를 저장 · 응답 시점 모두 적용하고, 업로드는 실제 decode로 형식을 확인 · 업로드 역할을 대조해 용량 제한 우회 차단
              - 개인정보를 DB에 저장하지 않는 정책에 맞춰 두 포털 11개 게시판 테이블의 이름 컬럼을 제거하고 사용자 ID 기반 조회로 전환, 탈퇴 회원 이름 비공개 · 외부 장애 시 부분 응답
              - 운영 데이터가 있는 테이블의 이관 · NOT NULL 전환 · 컬럼 삭제를 백필과 되돌리기 검증(실데이터 왕복)까지 포함해 진행하고, 배포 순서별 장애 구간을 정리해 공유
            result: ""
          - title: 리뷰 → 원칙 → 다음 작업에 먼저 적용
            problem: 초기 PR에서 트랜잭션 · 동시성 · 계층 · 검증 같은 설계 지적을 받았습니다.
            solution:
              - 리뷰 지적을 근본 원인 기준의 원칙 12개(트랜잭션 안에서 외부 I/O 금지, 저장될 값 기준 검증 등)와 PR 체크리스트로 정리
              - 설계 결정 66건을 맥락 · 선택지 · 기각 이유와 함께 기록하고, PR마다 대안 비교 · 측정 근거 · 영향 범위를 공유
            result: 이후 **PR 10건이 수정 요청 없이 승인**
          - title: CI 보안 게이트
            problem: ""
            solution:
              - GitHub Actions CI에 CVE 취약점 탐지를 추가하고, 취약점이 발견되면 병합을 차단하는 절차 적용
            result: ""
